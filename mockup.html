<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steel Receiving Mockup</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#1f2937;--mute:#6b7280;--line:#d1d5db;--accent:#1d4ed8;--hi:#fde68a;--ok:#15803d;--warn:#b45309}
@media (prefers-color-scheme:dark){:root{--bg:#111827;--card:#1f2937;--ink:#f3f4f6;--mute:#9ca3af;--line:#374151;--accent:#60a5fa;--hi:#78580a;--ok:#4ade80;--warn:#fbbf24}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,Segoe UI,sans-serif}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:16px;margin:0 12px 0 0}
nav button{padding:8px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;cursor:pointer;margin-right:4px}
nav button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.role{margin-left:auto;color:var(--mute);font-size:12px}
main{padding:16px}
.view{display:none}.view.on{display:block}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}
.card h2{margin:0 0 10px;font-size:15px}
.hint{color:var(--mute);font-size:12px;margin:0 0 10px}
/* fake PDF */
#doc{background:#fff;color:#111;border:1px solid var(--line);padding:22px;font:13px/1.7 Georgia,serif;user-select:none;cursor:crosshair;max-height:640px;overflow:auto}
#doc h3{margin:0 0 4px}
#doc table{border-collapse:collapse;width:100%;margin-top:8px}
#doc td,#doc th{border:1px solid #bbb;padding:3px 6px;text-align:left}
.w{padding:0 1px;border-radius:2px}.w:hover{background:#dbeafe}
.w.picked{background:var(--hi);color:#111;outline:1px solid #d97706}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px dashed var(--accent);color:var(--accent);background:transparent;border-radius:12px;padding:3px 10px;cursor:pointer;font-size:12px}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:2px}
input,select{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit}
input.active{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media(max-width:700px){.grid4{grid-template-columns:1fr 1fr}}
table.rows{width:100%;border-collapse:collapse;font-size:13px}
table.rows th{font-size:11px;text-align:left;color:var(--mute);padding:4px}
table.rows td{padding:2px}
button.btn{padding:9px 14px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font:inherit}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.big{padding:16px 20px;font-size:16px}
.bar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:var(--line);color:var(--ink)}
.tag.ok{background:var(--ok);color:#fff}.tag.warn{background:var(--warn);color:#fff}
.po{border:1px solid var(--line);border-radius:8px;padding:12px;margin:10px 0}
.po h3{margin:0 0 8px;font-size:14px}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:10px;padding:10px;border-bottom:1px solid var(--line);align-items:center}
.steps .n{width:26px;height:26px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:12px;flex:none}
.steps .done .n{background:var(--ok);color:#fff}
.steps .cur .n{background:var(--accent);color:#fff}
.steps .who{margin-left:auto;color:var(--mute);font-size:12px}
.tol{background:var(--bg);border:1px dashed var(--line);padding:10px;border-radius:6px;font-size:12px;color:var(--mute);margin:8px 0}
.empty{color:var(--mute);padding:20px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>Steel Receiving</h1>
  <nav>
    <button data-v="intake" class="on">1 Intake</button>
    <button data-v="inbox">2 Receiving inbox</button>
    <button data-v="form">3 Inspection form</button>
    <button data-v="status">4 Packet status</button>
  </nav>
  <span class="role">Mockup, sample data only</span>
</header>
<main>

<!-- INTAKE -->
<section id="v-intake" class="view on">
  <div class="split">
    <div class="card">
      <h2>Packet PDF (sample BOL)</h2>
      <p class="hint">Click a word or drag across words to fill the highlighted field on the right. Focus advances automatically.</p>
      <div id="doc"></div>
    </div>
    <div class="card">
      <h2>Index packet</h2>
      <div class="sugg" id="sugg"></div>
      <div class="grid4">
        <div><label>BOL #</label><input data-f="bol"></div>
        <div><label>Vendor</label><input data-f="vendor"></div>
        <div><label>Ship date</label><input data-f="ship"></div>
        <div><label>Carrier</label><input data-f="carrier"></div>
      </div>
      <table class="rows">
        <thead><tr><th>PO #</th><th>Heat #</th><th>Mill coil #</th><th>CC #</th><th>MTR #</th><th>Weight</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="bar">
        <button class="btn" id="addRow">+ Add row</button>
        <button class="btn" id="clear">Clear</button>
        <button class="btn pri" id="save">Save packet and create tasks</button>
      </div>
      <p class="hint" id="msg"></p>
    </div>
  </div>
</section>

<!-- INBOX -->
<section id="v-inbox" class="view">
  <div class="card" id="inboxBody"></div>
</section>

<!-- FORM -->
<section id="v-form" class="view">
  <div class="card" id="formBody"></div>
</section>

<!-- STATUS -->
<section id="v-status" class="view">
  <div class="card">
    <h2>Packet status</h2>
    <ol class="steps" id="steps"></ol>
  </div>
</section>

</main>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const BOL=`<h3>ACME STEEL MILL, Berkeley, SC</h3>
<div>BILL OF LADING &nbsp; <span class="w">BOL-778421</span></div>
<div>Ship date: <span class="w">09/29/2026</span> &nbsp; Carrier: <span class="w">Delta</span> <span class="w">Freight</span></div>
<div>Ship to: Nucor Building Systems, Terrell TX</div>
<table><tr><th>PO</th><th>Heat</th><th>Mill coil</th><th>MTR</th><th>Weight (lb)</th></tr>
<tr><td><span class="w">PO-45102</span></td><td><span class="w">H55821</span></td><td><span class="w">C-9001</span></td><td><span class="w">MTR-3301</span></td><td><span class="w">42,180</span></td></tr>
<tr><td><span class="w">PO-45102</span></td><td><span class="w">H55822</span></td><td><span class="w">C-9002</span></td><td><span class="w">MTR-3301</span></td><td><span class="w">41,960</span></td></tr>
<tr><td><span class="w">PO-45177</span></td><td><span class="w">H55907</span></td><td><span class="w">C-9114</span></td><td><span class="w">MTR-3302</span></td><td><span class="w">38,420</span></td></tr></table>
<div style="margin-top:12px">Coil cards: <span class="w">CC-20881</span> <span class="w">CC-20882</span> <span class="w">CC-20883</span></div>`;
const doc=$('#doc'); doc.innerHTML=BOL;
const HEAD=['bol','vendor','ship','carrier'], COLS=['po','heat','coil','cc','mtr','wt'];
let active=null, picked=new Map(); // span -> input
const pk={}; // saved packet

function addRow(vals={}){
  const tr=document.createElement('tr');
  tr.innerHTML=COLS.map(c=>`<td><input data-f="${c}" value="${vals[c]||''}"></td>`).join('')+'<td><button class="btn" title="Remove">x</button></td>';
  tr.querySelector('button').onclick=()=>tr.remove();
  $('#rows').appendChild(tr);
}
function order(){return $$('[data-f]')}
function setActive(el){ if(active)active.classList.remove('active'); active=el; if(el){el.classList.add('active');el.focus({preventScroll:true})}}
document.addEventListener('focusin',e=>{ if(e.target.matches('[data-f]')) setActive(e.target)});
function fill(text,spans){
  if(!active)return;
  active.value=text;
  spans.forEach(s=>{s.classList.add('picked');picked.set(s,active)});
  const o=order(), i=o.indexOf(active);
  if(i===o.length-1 && active.dataset.f==='wt'){/* last cell of last row stays */}
  else setActive(o[i+1]);
}
let down=null;
doc.addEventListener('mousedown',e=>{down=e.target});
doc.addEventListener('mouseup',e=>{
  const sel=getSelection(); let spans=[];
  if(sel&&!sel.isCollapsed){spans=$$('#doc .w').filter(s=>sel.containsNode(s,true))}
  else if(e.target.classList.contains('w')){spans=[e.target]}
  sel&&sel.removeAllRanges();
  if(!spans.length)return;
  fill(spans.map(s=>s.textContent).join(' ').replace(/^(BOL-|PO-|CC-|MTR-)/,m=>m),spans);
});
// touch support: tap = click
doc.addEventListener('click',()=>{});
// suggestions
const SUG=[['BOL # BOL-778421','bol','BOL-778421'],['Vendor ACME STEEL MILL','vendor','ACME STEEL MILL'],['Ship date 09/29/2026','ship','09/29/2026'],['Carrier Delta Freight','carrier','Delta Freight']];
$('#sugg').innerHTML='<span class="hint" style="margin:0">Suggestions:</span>';
SUG.forEach(([l,f,v])=>{const b=document.createElement('button');b.className='chip';b.textContent=l;b.onclick=()=>{const el=$(`[data-f=${f}]`);el.value=v;setActive(el)};$('#sugg').appendChild(b)});
const b=document.createElement('button');b.className='chip';b.textContent='Auto-fill all rows from table';
b.onclick=()=>{
  $('#rows').innerHTML='';
  $$('#doc table tr').slice(1).forEach(tr=>{const t=[...tr.children].map(td=>td.textContent);addRow({po:t[0],heat:t[1],coil:t[2],mtr:t[3],wt:t[4]});tr.querySelectorAll('.w').forEach(s=>s.classList.add('picked'))});
  const ccs=$$('#doc .w').map(s=>s.textContent).filter(t=>t.startsWith('CC-'));
  $$('#rows [data-f=cc]').forEach((el,i)=>{el.value=ccs[i]||''});
};
$('#sugg').appendChild(b);
$('#addRow').onclick=()=>{addRow();setActive($$('#rows tr:last-child [data-f]')[0])};
$('#clear').onclick=()=>{$$('[data-f]').forEach(i=>i.value='');$$('.picked').forEach(s=>s.classList.remove('picked'));$('#rows').innerHTML='';addRow();msg('')};
function msg(t){$('#msg').textContent=t}
addRow(); setActive($('[data-f=bol]'));

$('#save').onclick=()=>{
  const bol=$('[data-f=bol]').value.trim();
  const rows=$$('#rows tr').map(tr=>{const o={};$$('input',tr)&&[...tr.querySelectorAll('input')].forEach(i=>o[i.dataset.f]=i.value.trim());return o}).filter(r=>r.po);
  if(!bol||!rows.length){msg('Need BOL # and at least one row with a PO #.');return}
  Object.assign(pk,{bol,vendor:$('[data-f=vendor]').value,ship:$('[data-f=ship]').value,carrier:$('[data-f=carrier]').value,rows,forms:{}});
  msg('Saved. Tasks created for '+[...new Set(rows.map(r=>r.po))].length+' PO(s). Open "Receiving inbox".');
  renderInbox(); renderStatus(); go('inbox');
};

// INBOX
const TYPES=['Coil','Flat sheet','Flat bar','Beam / channel / angle','Rod / pipe / tube'];
function pos(){return [...new Set(pk.rows.map(r=>r.po))]}
function renderInbox(){
  const el=$('#inboxBody');
  if(!pk.bol){el.innerHTML='<div class="empty">No packets yet. Save one from Intake.</div>';return}
  el.innerHTML=`<h2>Task: BOL ${pk.bol} <span class="tag warn">Inspection pending</span></h2>
  <p class="hint">${pk.vendor||''} | ${pk.ship||''} | ${pk.carrier||''}. Tablet view: big tap targets, one inspection per PO per material type.</p>`+
  pos().map(p=>{const rs=pk.rows.filter(r=>r.po===p);
    return `<div class="po"><h3>${p} <span class="hint">${rs.length} item(s)</span></h3>
    <div class="bar" style="margin-top:0">${TYPES.map((t,i)=>{const done=pk.forms[p+'|'+i];return `<button class="btn big ${done?'':''}" onclick="openForm('${p}',${i})">${t} ${done?'<span class=tag-ok>done</span>':''}</button>`}).join('')}</div></div>`}).join('')+
  `<div class="bar"><button class="btn pri big" onclick="complete()">Inspection Complete</button></div><p class="hint" id="cmsg"></p>`;
}
let cur=null;
function openForm(p,t){cur={p,t};renderForm();go('form')}
function renderForm(){
  if(!cur){$('#formBody').innerHTML='<div class="empty">Open a form from the inbox.</div>';return}
  const rs=pk.rows.filter(r=>r.po===cur.p);
  $('#formBody').innerHTML=`<h2>${TYPES[cur.t]} inspection</h2>
  <div class="grid4"><div><label>PO # (pre-filled)</label><input value="${cur.p}" readonly></div><div><label>BOL #</label><input value="${pk.bol}" readonly></div><div><label>Vendor</label><input value="${pk.vendor}" readonly></div><div><label>Ship date</label><input value="${pk.ship}" readonly></div></div>
  <div class="tol">[Tolerance table image from the paper ${TYPES[cur.t]} sheet goes here]</div>
  <table class="rows"><thead><tr><th>CC #</th><th>Heat #</th><th>Weight</th><th>Width</th><th>Thickness</th><th>Result</th></tr></thead><tbody>
  ${rs.map(r=>`<tr><td><input value="${r.cc}" readonly></td><td><input value="${r.heat}" readonly></td><td><input value="${r.wt}" readonly></td><td><input inputmode="decimal"></td><td><input inputmode="decimal"></td><td><select><option>Pass</option><option>Fail</option></select></td></tr>`).join('')}</tbody></table>
  <div class="bar"><button class="btn pri big" onclick="submitForm()">Submit inspection</button><button class="btn big" onclick="go('inbox')">Back</button></div>`;
}
function submitForm(){pk.forms[cur.p+'|'+cur.t]=true;renderInbox();renderStatus();go('inbox')}
function complete(){
  const miss=pos().filter(p=>!TYPES.some((_,i)=>pk.forms[p+'|'+i]));
  if(miss.length){$('#cmsg').textContent='Blocked: no inspection submitted for '+miss.join(', ');return}
  pk.complete=true;renderStatus();go('status');
}

// STATUS
const STEPS=[['Packet built (Bluebeam)','Coordinator'],['Packet indexed','Coordinator'],['Task created, grouped by PO#','System'],['Inspect and submit forms','Receiving Team'],['Forms attached to packet','System'],['Inspection Complete','Receiving Team'],['Review','Boothe, Segovia, Parsons, Coordinator'],['Receive in D365','Coordinator'],['Authorize','Coordinator'],['Export bundle for DocuWare upload','System']];
function renderStatus(){
  let c=0; if(pk.bol)c=3; if(pk.bol&&Object.keys(pk.forms).length)c=4; if(pk.complete)c=6;
  $('#steps').innerHTML=STEPS.map((s,i)=>`<li class="${i<c?'done':i===c?'cur':''}"><span class="n">${i<c?'&#10003;':i+1}</span><span>${s[0]}</span><span class="who">${s[1]}</span></li>`).join('');
}
function go(v){$$('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));$$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));if(v==='inbox')renderInbox();if(v==='form')renderForm();if(v==='status')renderStatus()}
$$('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
renderInbox();renderForm();renderStatus();
</script>
</body>
</html>
