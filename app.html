<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steel Receiving</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{
  --dg:#213B34; --mg:#006325; --lg:#A1CEAD; --pg:#D9E8E2; --blue:#7CC5EB; --lblue:#BFE2F6; --gray:#F5F4F0;
  --ink:#1b2a26; --mute:#5d6b66; --line:#dcdad2; --card:#fff; --amber:#a15c00; --amberbg:#fdf1d8; --red:#a12626; --redbg:#fbe4e4;
  --r:10px; --shadow:0 1px 2px rgba(33,59,52,.08),0 4px 14px rgba(33,59,52,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--gray);color:var(--ink);font:15px/1.45 Arial,Helvetica,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
svg.ic{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}

/* top bar */
.top{background:var(--dg);color:#fff;display:flex;align-items:center;gap:20px;padding:0 24px;height:64px;position:sticky;top:0;z-index:20}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-size:19px;letter-spacing:.3px}
.brand span{font-size:11px;color:var(--lg);letter-spacing:.8px;text-transform:uppercase;margin-top:3px}
.tabs{display:flex;gap:4px;height:100%}
.tabs a{display:flex;align-items:center;gap:8px;padding:0 18px;color:#cfe0d7;text-decoration:none;border-bottom:3px solid transparent;font-weight:bold}
.tabs a:hover{color:#fff}
.tabs a.on{color:#fff;border-bottom-color:var(--lg)}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:10px}
.seg{display:inline-flex;background:rgba(255,255,255,.1);border-radius:8px;padding:3px}
.seg button{background:none;border:0;color:#cfe0d7;padding:7px 14px;border-radius:6px;cursor:pointer;font-weight:bold;font-size:13px}
.seg button.on{background:#fff;color:var(--dg)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--lg);color:var(--dg);display:grid;place-items:center;font-weight:bold;font-size:13px}

main{max-width:1500px;margin:0 auto;padding:24px}
.pagehead{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.pagehead h1{font-size:26px;color:var(--dg)}
.pagehead p{margin:4px 0 0;color:var(--mute)}
.pagehead .grow{flex:1}
.crumb{display:inline-flex;align-items:center;gap:6px;color:var(--mg);font-weight:bold;text-decoration:none;margin-bottom:10px;cursor:pointer;background:none;border:0;padding:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:bold;color:var(--dg);transition:background .12s}
.btn:hover{background:var(--pg)}
.btn.pri{background:var(--mg);border-color:var(--mg);color:#fff}
.btn.pri:hover{background:#00521f}
.btn.dark{background:var(--dg);border-color:var(--dg);color:#fff}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.btn.big{min-height:56px;font-size:17px;padding:0 26px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent}

/* cards, chips */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.card h2{font-size:17px;color:var(--dg);margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:bold;background:var(--pg);color:var(--dg);white-space:nowrap}
.chip.new{background:var(--lblue);color:#0b4a6e}
.chip.inspecting{background:#e8f1c9;color:#4a5b00}
.chip.review{background:var(--amberbg);color:var(--amber)}
.chip.receive,.chip.authorize{background:var(--pg);color:var(--mg)}
.chip.filed{background:var(--dg);color:#fff}
.chip.po{background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:normal}
.muted{color:var(--mute)}
.mono{font-variant-numeric:tabular-nums}

/* receiver inbox */
.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.pill{min-height:44px;padding:0 18px;border-radius:99px;border:1px solid var(--line);background:#fff;font-weight:bold;cursor:pointer;color:var(--dg)}
.pill.on{background:var(--dg);color:#fff;border-color:var(--dg)}
.pill i{font-style:normal;margin-left:8px;opacity:.7}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
.pk{display:flex;flex-direction:column;gap:12px;cursor:pointer;border-left:6px solid var(--mg);transition:transform .1s,box-shadow .1s}
.pk:hover{transform:translateY(-1px);box-shadow:0 2px 4px rgba(33,59,52,.1),0 8px 22px rgba(33,59,52,.1)}
.pk.new{border-left-color:var(--blue)}
.pk .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pk .bol{font-size:22px;font-weight:bold;color:var(--dg)}
.pk .vendor{color:var(--mute);margin-top:2px}
.pk .pos{display:flex;gap:6px;flex-wrap:wrap}
.prog{height:8px;border-radius:99px;background:var(--pg);overflow:hidden}
.prog>div{height:100%;background:var(--mg);border-radius:99px}
.pk .foot{display:flex;justify-content:space-between;color:var(--mute);font-size:13px}

/* packet detail */
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:18px;align-items:start}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:6px}
.kv label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);margin-bottom:3px}
.kv div div{font-weight:bold;font-size:16px;color:var(--dg)}
.pobox{border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px;background:#fff}
.pobox .ph{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.pobox .ph h3{font-size:18px;color:var(--dg)}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.type{min-height:76px;border:1.5px solid var(--line);border-radius:10px;background:var(--gray);cursor:pointer;text-align:left;padding:10px 14px;display:flex;flex-direction:column;justify-content:center;gap:4px;font-weight:bold;color:var(--dg)}
.type:hover{border-color:var(--mg);background:var(--pg)}
.type small{font-weight:normal;color:var(--mute);font-size:12px}
.type.done{background:var(--pg);border-color:var(--mg)}
.type.draft{background:var(--amberbg);border-color:#e3b25a}
.lines{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.lines th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mute);padding:6px 8px;border-bottom:1px solid var(--line)}
.lines td{padding:7px 8px;border-bottom:1px solid #eeece6}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 16px 26px;font-size:13px}
.timeline li:before{content:"";position:absolute;left:5px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--mg)}
.timeline li:after{content:"";position:absolute;left:9px;top:16px;bottom:-4px;width:2px;background:var(--pg)}
.timeline li:last-child:after{display:none}
.timeline b{display:block;color:var(--dg)}
.steps{display:flex;gap:0;margin-bottom:18px;overflow-x:auto}
.step{flex:1;min-width:120px;text-align:center;font-size:12px;color:var(--mute);position:relative;padding-top:30px}
.step:before{content:"";position:absolute;top:11px;left:0;right:0;height:3px;background:var(--line)}
.step:first-child:before{left:50%}.step:last-child:before{right:50%}
.step i{position:absolute;top:2px;left:50%;margin-left:-10px;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--line);z-index:1}
.step.done:before{background:var(--mg)}
.step.done i{background:var(--mg);border-color:var(--mg)}
.step.cur i{border-color:var(--mg);background:#fff;box-shadow:0 0 0 4px var(--pg)}
.step.cur{color:var(--dg);font-weight:bold}
.action{background:var(--pg);border-radius:var(--r);padding:16px;margin-top:14px}
.action h3{font-size:15px;margin-bottom:8px;color:var(--dg)}
.approvals{display:grid;gap:8px}
.apr{display:flex;align-items:center;gap:10px;background:#fff;border-radius:8px;padding:8px 12px}
.apr .nm{flex:1;font-weight:bold}

/* board */
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px}
@media(max-width:1100px){.stats{grid-template-columns:repeat(3,1fr)}}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;box-shadow:var(--shadow);text-align:left}
.stat .n{font-size:30px;font-weight:bold;color:var(--dg);line-height:1}
.stat .l{font-size:12px;color:var(--mute);margin-top:6px}
.stat.on{outline:3px solid var(--mg);outline-offset:-1px}
.toolbar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:0 14px 0 40px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:#fff}
.search svg{position:absolute;left:13px;top:13px;color:var(--mute)}
table.list{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.list th{background:var(--dg);color:#fff;text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.6px;padding:12px 14px}
.list td{padding:13px 14px;border-bottom:1px solid #eeece6;vertical-align:middle}
.list tr.r{cursor:pointer}
.list tr.r:hover td{background:#f1f7f4}
.list .b{font-weight:bold;color:var(--dg)}
.age.hot{color:var(--red);font-weight:bold}
.mini{display:inline-flex;align-items:center;gap:8px}
.mini .prog{width:70px}

/* forms (tablet) */
.fh{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
@media(max-width:900px){.fh{grid-template-columns:1fr 1fr}}
.fld label{display:block;font-size:12px;font-weight:bold;color:var(--mute);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.fld input,.fld select,.fld textarea{width:100%;min-height:52px;padding:0 14px;font-size:18px;border:1.5px solid #c9c7be;border-radius:8px;background:#fff}
.fld textarea{padding:12px 14px;min-height:80px}
.fld input:focus,.fld textarea:focus{outline:3px solid var(--blue);border-color:var(--mg)}
.fld input[readonly]{background:var(--gray);border-color:var(--line);color:var(--dg);font-weight:bold}
.tol{display:flex;gap:10px;align-items:center;background:var(--lblue);color:#0b4a6e;border-radius:8px;padding:12px 16px;margin-bottom:16px;font-weight:bold;cursor:pointer;border:0;width:100%;text-align:left}
.item{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.item.skip{opacity:.5}
.item .ih{display:flex;align-items:center;gap:14px;padding:12px 16px;background:var(--pg);flex-wrap:wrap}
.item .ih .n{width:30px;height:30px;border-radius:50%;background:var(--dg);color:#fff;display:grid;place-items:center;font-weight:bold;font-size:14px}
.item .ih .t{font-weight:bold;color:var(--dg);font-size:16px}
.item .ih .s{color:var(--mute);font-size:13px}
.item .ib{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.toggle{display:flex;border:1.5px solid #c9c7be;border-radius:8px;overflow:hidden;min-height:52px}
.toggle button{flex:1;border:0;background:#fff;font-weight:bold;cursor:pointer;font-size:16px}
.toggle button.on.ok{background:var(--mg);color:#fff}
.toggle button.on.bad{background:var(--red);color:#fff}
.sticky{position:sticky;bottom:0;background:rgba(245,244,240,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line);margin:0 -24px -24px;padding:14px 24px;display:flex;gap:12px;align-items:center;z-index:10}

/* intake index */
.ix{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;align-items:start}
@media(max-width:1100px){.ix{grid-template-columns:1fr}}
#stage{position:relative;overflow:auto;max-height:76vh;border:1px solid var(--line);background:#8a948f;border-radius:8px}
#wrap{position:relative;display:inline-block}
#cv{display:block}
#ov{position:absolute;inset:0;cursor:crosshair;touch-action:none}
.box{position:absolute;border:1px solid #d97706;background:rgba(250,204,21,.35);pointer-events:none}
.sel{position:absolute;border:2px dashed var(--mg);background:rgba(0,99,37,.15);pointer-events:none}
.vtool{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.vtool select{min-height:34px;border:1px solid var(--line);border-radius:8px;padding:0 8px;max-width:230px;background:#fff}
.num{background:var(--pg);padding:4px 10px;border-radius:99px;font-size:12px;font-weight:bold;color:var(--dg)}
.fld.sm input{min-height:40px;font-size:14px;padding:0 10px}
.fld input.active{outline:3px solid var(--blue);border-color:var(--mg)}
.tw{overflow-x:auto}
table.cells{border-collapse:collapse;width:100%;min-width:620px}
table.cells th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mute);text-align:left;padding:4px;cursor:pointer;white-space:nowrap}
table.cells th:hover{color:var(--mg)}
table.cells td{padding:3px}
table.cells input{width:100%;min-height:38px;padding:0 8px;border:1.5px solid #c9c7be;border-radius:6px;background:#fff;font-size:14px}
table.cells input.active{outline:3px solid var(--blue);border-color:var(--mg)}
#ocr{font-size:13px;color:var(--mute);min-height:20px;margin:6px 0 12px}
#ocr.busy{color:var(--amber)}#ocr.err{color:var(--red)}
label.ck{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--mute)}

/* drawer */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100vw);background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.25);transform:translateX(105%);transition:transform .22s;z-index:50;display:flex;flex-direction:column}
#drawer.open{transform:none}
#drawer .dh{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--dg);color:#fff}
#drawer .dh b{flex:1}
#drawer .db{flex:1;overflow:auto;background:#8a948f;padding:14px}
.pg{background:#fff;margin:0 auto 14px;position:relative;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.pg canvas{display:block;max-width:100%;height:auto}
.pg .rb{position:absolute;top:8px;right:8px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px);background:var(--dg);color:#fff;padding:12px 22px;border-radius:99px;opacity:0;transition:.2s;z-index:60;font-weight:bold;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.empty{padding:50px 20px;text-align:center;color:var(--mute)}
.pagefoot{text-align:center;color:var(--mute);font-size:12px;padding:20px}
.pagefoot a{color:var(--mg);cursor:pointer}

/* tablet tuning */
@media (pointer:coarse){.btn.sm{min-height:44px}.tabs a{padding:0 14px}}
@media(max-width:820px){.top{padding:0 12px;gap:10px}.brand span{display:none}main{padding:14px}.sticky{margin:0 -14px -14px;padding:12px 14px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>Steel Receiving</b><span>Nucor Building Systems Texas</span></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="spacer"></div>
  <div class="who">
    <div class="seg" id="roleSeg"><button data-r="receiver">Receiver</button><button data-r="intake">Intake</button></div>
    <div class="avatar" id="avatar"></div>
  </div>
</header>
<main id="app"></main>
<div class="pagefoot">Prototype with sample data. Data is stored in this browser only. <a id="reset">Reset sample data</a></div>
<div id="drawer"><div class="dh"><b id="dtitle">Packet</b><button class="btn sm" id="dclose">Close</button></div><div class="db" id="dbody"></div></div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IC={
 inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/>',
 list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
 check:'<path d="M20 6 9 17l-5-5"/>',
 back:'<path d="M15 18l-6-6 6-6"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
 rot:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
 dl:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
 info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>'};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24">${IC[n]||''}</svg>`;

/* ---------------- data ---------------- */
const STAGES=[['new','Awaiting inspection'],['inspecting','In inspection'],['review','In review'],['receive','Ready to receive'],['authorize','Ready to authorize'],['filed','Filed']];
const SL=Object.fromEntries(STAGES);
const REVIEWERS=['John Boothe','Lonnie Segovia','Jessica Parsons','Receiving Coordinator'];
const TYPES=[
 {k:'coil',n:'Coil',show:['coil','heat','desc','cc'],meas:[['id','I.D.'],['od','O.D.'],['gauge','Gauge'],['width','Width'],['color','Color','text']]},
 {k:'sheet',n:'Flat sheet',pending:1,show:['heat','desc','cc'],meas:[['qty','Qty Rec/BOL'],['thick','Thickness'],['width','Width'],['len','Length']]},
 {k:'bar',n:'Flat bar',pending:1,show:['heat','desc','cc'],meas:[['qty','Qty Rec/BOL'],['thick','Thickness'],['width','Width'],['len','Length']]},
 {k:'shape',n:'Beam, channel, angle',show:['heat','desc','cc'],meas:[['qty','Qty Rec/BOL'],['depth','Depth'],['width','Width'],['thick','Thickness'],['sweep','Sweep / Camber'],['visual','Visual Insp.','ok'],['cert','Cert.','ok']]},
 {k:'tube',n:'Rod, pipe, tube',pending:1,show:['heat','desc','cc'],meas:[['qty','Qty Rec/BOL'],['dia','Diameter'],['wall','Wall'],['len','Length']]}];
const FL={coil:'Coil #',heat:'Heat #',desc:'Description',cc:'NBS # (CC #)',po:'PO #',wt:'Weight'};
const h=n=>Date.now()-n*3600e3;
function R(po,heat,coil,cc,desc,wt){return{po,heat,coil,cc,desc,wt}}
const BERK=[R('TX-0015373','1612252','61123384','161886','W12x30','7,740'),R('TX-0015373','2612251','61123486','161887','W12x30','7,740'),R('TX-0015373','2612253','61123402','161888','W12x30','7,740'),R('TX-0015373','1612252','61123386','161889','W12x30','7,740'),R('TX-0015373','1612252','61123385','161890','W12x30','7,740'),R('TX-0015478','1612390','61124736','161891','W12x26','7,800')];
const ARK=[1,2,3].map(i=>R('TX-0013183','2157562','2115023.'+i+'000','15683'+(1+i),'.0940 x 14.0600 HRO','13,406'));
function seed(){
  const sub=(po,t,by,items)=>({[po+'|'+t]:{submitted:true,inspector:by,date:'',items}});
  const L=(w,x)=>({t:h(w),who:x[0],what:x[1]});
  const berkForm=sub('TX-0015373','shape','JH',BERK.slice(0,5).map(()=>({qty:'6',depth:'6 5/8',width:'12 3/8',thick:'.254',sweep:'',visual:'ok',cert:'ok'})));
  return {role:'receiver',packets:[

const KEY='nbsReceiving.app.v1';
let DB;
try{DB=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!DB||!DB.packets)DB=seed();
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}};
$('#reset').onclick=()=>{DB=seed();persist();toast('Sample data reset');route()};
const P=id=>DB.packets.find(p=>p.id===id);
const pos=p=>[...new Set(p.rows.map(r=>r.po))];
const subForms=(p,po)=>TYPES.filter(t=>p.forms[po+'|'+t.k]?.submitted);
const covered=p=>pos(p).filter(po=>subForms(p,po).length).length;
const ago=ts=>{const m=(Date.now()-ts)/6e4;return m<60?Math.round(m)+' min':m<1440?Math.round(m/60)+' h':Math.round(m/1440)+' d'};
const fdate=ts=>new Date(ts).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
const stageAge=p=>Date.now()-((p.log[p.log.length-1]||{}).t||p.created);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}
function addLog(p,who,what){p.log.push({t:Date.now(),who,what})}
const ME=()=>DB.role==='receiver'?{n:'Receiver',i:'RX'}:{n:'Receiving Coordinator',i:'RC'};

/* ---------------- router ---------------- */
function nav(h){location.hash=h}
window.addEventListener('hashchange',route);
function route(){
  const parts=(location.hash||'').replace(/^#\/?/,'').split('/').map(decodeURIComponent);
  const r=DB.role;
  document.title='Steel Receiving';
  $$('#roleSeg button').forEach(b=>b.classList.toggle('on',b.dataset.r===r));
  $('#avatar').textContent=ME().i;
  $('#tabs').innerHTML=(r==='receiver'
    ?[['inbox','inbox','My inbox']]
    :[['board','list','Packets'],['new','plus','New packet']]
   ).map(([k,i,l])=>`<a href="#/${k}" class="${parts[0]===k||(k==='inbox'&&parts[0]==='p'&&r==='receiver')||(k==='board'&&parts[0]==='p'&&r==='intake')?'on':''}">${ic(i)} ${l}</a>`).join('');
  const v=parts[0];
  if(v==='p'&&parts[2]==='f')return viewForm(parts[1],parts[3],parts[4]);
  if(v==='p')return viewPacket(parts[1]);
  if(v==='board'&&r==='intake')return viewBoard();
  if(v==='new'&&r==='intake')return viewNew();
  if(v==='inbox'&&r==='receiver')return viewInbox();
  nav(r==='receiver'?'/inbox':'/board');
}
$$('#roleSeg button').forEach(b=>b.onclick=()=>{DB.role=b.dataset.r;persist();nav(DB.role==='receiver'?'/inbox':'/board');route()});

/* ---------------- receiver inbox ---------------- */
let inboxF='todo';
function viewInbox(){
  const todo=DB.packets.filter(p=>p.stage==='new'||p.stage==='inspecting');
  const done=DB.packets.filter(p=>p.stage!=='new'&&p.stage!=='inspecting');
  const list=(inboxF==='todo'?todo:done).sort((a,b)=>inboxF==='todo'?a.created-b.created:b.created-a.created);
  $('#app').innerHTML=`
  <div class="pagehead"><div class="grow"><h1>My inbox</h1><p>Packets waiting for inspection on the dock.</p></div></div>
  <div class="filters">
    <button class="pill ${inboxF==='todo'?'on':''}" data-f="todo">To inspect <i>${todo.length}</i></button>
    <button class="pill ${inboxF==='done'?'on':''}" data-f="done">Submitted <i>${done.length}</i></button>
  </div>
  ${list.length?`<div class="cards">${list.map(pkCard).join('')}</div>`:`<div class="card empty">${inboxF==='todo'?'Nothing to inspect right now.':'No submitted packets.'}</div>`}`;
  $$('.pill[data-f]').forEach(b=>b.onclick=()=>{inboxF=b.dataset.f;viewInbox()});
  $$('.pk').forEach(c=>c.onclick=()=>nav('/p/'+c.dataset.id));
}
function pkCard(p){
  const n=pos(p).length,c=covered(p);

   <div class="row1"><div><div class="bol">BOL ${esc(p.bol)}</div><div class="vendor">${esc(p.vendor)}</div></div><span class="chip ${p.stage}">${SL[p.stage]}</span></div>
   <div class="pos">${pos(p).map(x=>`<span class="chip po">${esc(x)}</span>`).join('')}</div>
   <div><div class="prog"><div style="width:${n?c/n*100:0}%"></div></div></div>
   <div class="foot"><span>${c} of ${n} PO${n===1?'':'s'} inspected</span><span>${p.rows.length} item${p.rows.length===1?'':'s'} &middot; ${ago(p.created)} ago</span></div></div>`;
}

  <div class="stats">${STAGES.map(([k,l])=>`<button class="stat ${boardF===k?'on':''}" data-s="${k}"><div class="n">${cnt(k)}</div><div class="l">${l}</div></button>`).join('')}</div>
  <div class="toolbar"><div class="search">${ic('search')}<input id="q" placeholder="Search BOL, PO, vendor, heat, CC #" value="${esc(boardQ)}"></div>

  ${rows.length?rows.map(p=>{const n=pos(p).length,c=covered(p),hot=p.stage!=='filed'&&stageAge(p)>24*3600e3;
   return `<tr class="r" data-id="${p.id}"><td class="b">${esc(p.bol)}</td><td>${esc(p.vendor)}</td><td>${pos(p).map(x=>`<span class="chip po">${esc(x)}</span>`).join(' ')}</td><td class="mono">${p.rows.length}</td>
   <td><span class="mini"><span class="prog"><div style="width:${n?c/n*100:0}%"></div></span><span class="mono muted">${c}/${n}</span></span></td>
   <td><span class="chip ${p.stage}">${SL[p.stage]}</span></td><td class="age ${hot?'hot':''}">${ago(Date.now()-stageAge(p))}</td></tr>`}).join(''):`<tr><td colspan="7" class="empty">No packets match.</td></tr>`}

  $$('[data-s]').forEach(b=>b.onclick=()=>{boardF=b.dataset.s===boardF?'all':b.dataset.s;viewBoard()});

/* ---------------- packet detail ---------------- */

  <div class="pagehead"><div class="grow"><h1>BOL ${esc(p.bol)}</h1><p>${esc(p.vendor)} &middot; ${esc(p.carrier||'')} &middot; shipped ${esc(p.ship||'')}</p></div>
   <span class="chip ${p.stage}" style="font-size:14px;padding:6px 14px">${SL[p.stage]}</span>
   <button class="btn" id="viewpdf">${ic('file')} View packet PDF</button></div>

    <div class="card"><h2>${editable?'Inspections by PO':'Inspections'}</h2>
    <p class="muted" style="margin:-4px 0 4px">One inspection per PO and material type. Items of the same type go in the same form.</p>
    ${pos(p).map(po=>{const rs=p.rows.filter(r=>r.po===po);
     return `<div class="pobox"><div class="ph"><h3>${esc(po)}</h3><span class="muted">${rs.length} item${rs.length===1?'':'s'}</span>${subForms(p,po).length?`<span class="chip filed" style="background:var(--mg)">${ic('check')} Inspected</span>`:`<span class="chip new">Needs inspection</span>`}</div>
      <div class="types">${TYPES.map(t=>{const f=p.forms[po+'|'+t.k];const cls=f?(f.submitted?'done':'draft'):'';
       return `<button class="type ${cls}" data-po="${esc(po)}" data-t="${t.k}">${t.n}<small>${f?(f.submitted?'Submitted':'Draft saved'):(editable?'Start inspection':'Not used')}</small></button>`}).join('')}</div>
      <table class="lines"><thead><tr><th>Heat #</th><th>Coil / bundle #</th><th>CC #</th><th>Description</th><th>Weight</th></tr></thead><tbody>${rs.map(r=>`<tr><td>${esc(r.heat)}</td><td>${esc(r.coil)}</td><td><b>${esc(r.cc)}</b></td><td>${esc(r.desc)}</td><td>${esc(r.wt)}</td></tr>`).join('')}</tbody></table></div>`}).join('')}
    ${editable?`<div class="action"><h3>Finish inspection</h3><p class="muted" style="margin:0 0 10px">${allCov?'Every PO has an inspection. Send the packet to review.':'Submit at least one inspection for every PO first ('+covered(p)+' of '+pos(p).length+' done).'}</p><button class="btn pri big" id="complete" ${allCov?'':'disabled'}>${ic('check')} Inspection complete</button></div>`:''}
    ${intake?stageAction(p):''}
    </div></div>
    <div><div class="card"><h2>Packet</h2><div class="kv"><div><label>BOL #</label><div>${esc(p.bol)}</div></div><div><label>Items</label><div>${p.rows.length}</div></div><div><label>Received</label><div>${ago(p.created)} ago</div></div>${p.d365?`<div><label>D365 receipt</label><div>${esc(p.d365)}</div></div>`:''}</div></div>
    <div class="card" style="margin-top:18px"><h2>Activity</h2><ul class="timeline">${[...p.log].reverse().map(l=>`<li><b>${esc(l.what)}</b><span class="muted">${esc(l.who)} &middot; ${fdate(l.t)}</span></li>`).join('')}</ul></div></div>
  </div>`;
  $('#back').onclick=()=>nav(intake?'/board':'/inbox');
  $('#viewpdf').onclick=()=>openPdf(p);
  $$('.type').forEach(b=>b.onclick=()=>nav('/p/'+p.id+'/f/'+encodeURIComponent(b.dataset.po)+'/'+b.dataset.t));
  const c=$('#complete');if(c)c.onclick=()=>{p.stage='review';addLog(p,ME().n,'Inspection complete, sent to review');persist();toast('Sent to review');viewPacket(id)};
  bindAction(p);
}
function stageAction(p){
  if(p.stage==='review')return `<div class="action"><h3>Review approvals</h3><div class="approvals">${REVIEWERS.map(n=>{const a=p.approvals.find(x=>x.n===n);return `<div class="apr"><span class="nm">${n}</span>${a?`<span class="chip">${ic('check')} Approved ${fdate(a.t)}</span>`:`<button class="btn sm pri" data-appr="${n}">Approve</button>`}</div>`}).join('')}</div><p class="muted" style="margin:10px 0 0;font-size:12px">Prototype: Intake can approve on behalf of each reviewer. Production sends each person a task.</p></div>`;
  if(p.stage==='receive')return `<div class="action"><h3>Receive in D365</h3><p class="muted" style="margin:0 0 10px">Receive the PO lines in D365, then record the receipt number.</p><div class="fld" style="display:flex;gap:10px;align-items:end;flex-wrap:wrap"><div style="flex:1;min-width:200px"><label>D365 receipt #</label><input id="d365" placeholder="PR-000000"></div><button class="btn pri" id="recv" style="min-height:52px">Mark received</button></div></div>`;
  if(p.stage==='authorize')return `<div class="action"><h3>Authorize</h3><p class="muted" style="margin:0 0 10px">D365 receipt ${esc(p.d365)}. Authorizing files the packet.</p><button class="btn pri big" id="auth">${ic('check')} Authorize and file</button></div>`;
  if(p.stage==='filed')return `<div class="action"><h3>Filed</h3><p class="muted" style="margin:0 0 10px">Authorized by ${esc(p.authBy||'')} ${p.authAt?fdate(p.authAt):''}. DocuWare is manual: upload the PDF and tag it with this index sheet.</p><button class="btn dark" id="csv">${ic('dl')} Download DocuWare index (CSV)</button></div>`;
  return '';
}
function bindAction(p){
  $$('[data-appr]').forEach(b=>b.onclick=()=>{p.approvals.push({n:b.dataset.appr,t:Date.now()});addLog(p,b.dataset.appr,'Approved');if(p.approvals.length>=REVIEWERS.length){p.stage='receive';addLog(p,'System','All reviewers approved')}persist();viewPacket(p.id)});
  const r=$('#recv');if(r)r.onclick=()=>{const v=$('#d365').value.trim();if(!v)return toast('Enter the D365 receipt number');p.d365=v;p.stage='authorize';addLog(p,ME().n,'Received in D365 ('+v+')');persist();viewPacket(p.id)};
  const a=$('#auth');if(a)a.onclick=()=>{p.stage='filed';p.authBy=ME().n;p.authAt=Date.now();addLog(p,ME().n,'Authorized, filed');persist();toast('Packet filed');viewPacket(p.id)};
  const c=$('#csv');if(c)c.onclick=()=>exportCsv(p);

function exportCsv(p){
  const head=['BOL #','Vendor','Ship date','PO #','Heat #','Mill coil / bundle #','CC # (NBS#)','Description','Weight','D365 receipt #','Authorized by'];
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const csv=[head,...p.rows.map(r=>[p.bol,p.vendor,p.ship,r.po,r.heat,r.coil,r.cc,r.desc,r.wt,p.d365||'',p.authBy||''])].map(a=>a.map(q).join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='DocuWare index BOL '+p.bol+'.csv';a.click();

    ${canEdit?`<label class="ck"><input type="checkbox" data-k="skip" ${it.skip?'checked':''}> Not this material</label>`:''}</div>

     <div class="fld" style="grid-column:1/-1"><label>Comments</label><input data-k="comments" value="${esc(it.comments||'')}" ${ro}></div></div></div>`}).join('')}
  <div class="sticky"><button class="btn big" id="cancel">${canEdit?'Save draft':'Back'}</button><span class="muted" id="saved"></span><span style="flex:1"></span>

    $('#cancel').onclick=()=>{save();toast('Draft saved');nav('/p/'+id)};
    $('#submit').onclick=()=>{save();

}

/* ---------------- drawers ---------------- */
function closeDrawer(){$('#drawer').classList.remove('open')}
$('#dclose').onclick=closeDrawer;
function openText(title,txt){$('#dtitle').textContent=title;$('#dbody').innerHTML=`<div class="card empty">${esc(txt)}</div>`;$('#drawer').classList.add('open')}
async function openPdf(p){
  $('#dtitle').textContent='BOL '+p.bol+' packet';$('#drawer').classList.add('open');
  const body=$('#dbody');
  if(!p.pdf&&!p.pdfBlob){body.innerHTML='<div class="card empty">No PDF attached to this sample packet.</div>';return}
  body.innerHTML='<div class="card empty">Loading...</div>';
  try{
    const buf=p.pdfBlob?await (await fetch(p.pdfBlob)).arrayBuffer():await (await fetch('/'+encodeURIComponent(p.pdf))).arrayBuffer();
    const doc=await pdfjsLib.getDocument({data:buf}).promise;body.innerHTML='';
    for(let i=1;i<=doc.numPages;i++){
      const pg=await doc.getPage(i);let rot=pg.rotate||0;
      const w=document.createElement('div');w.className='pg';const cv=document.createElement('canvas');w.appendChild(cv);
      const b=document.createElement('button');b.className='btn sm rb';b.innerHTML=ic('rot')+' Rotate';w.appendChild(b);body.appendChild(w);
      const draw=async()=>{const vp=pg.getViewport({scale:1.6,rotation:rot});cv.width=vp.width;cv.height=vp.height;await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise};
      b.onclick=()=>{rot=(rot+90)%360;draw()};await draw();
    }
  }catch(e){body.innerHTML='<div class="card empty">Could not load PDF: '+esc(e.message)+'</div>'}
}

/* ---------------- intake: new packet w/ click-to-index ---------------- */
const SAMPLES=['B5 Completed Preliminary BOL-MTR Packet.pdf','Berkeley Multi PO, multi insp packet.pdf','Delta multi Insp sheet packet.pdf','B1 BOL with CC Numbers.pdf'];
const COLS=[['po','PO #'],['heat','Heat #'],['coil','Coil / bundle #'],['cc','CC # (NBS#)'],['desc','Description'],['wt','Weight']];
let pdf=null,pageNo=1,scale=1.5,rot={},boxes={},active=null,ocrWorker=null,curPdfName=null,curBlob=null;
function viewNew(){
  pdf=null;boxes={};rot={};pageNo=1;active=null;curPdfName=null;curBlob=null;
  $('#app').innerHTML=`
  <div class="pagehead"><div class="grow"><h1>New packet</h1><p>Open the merged packet PDF, then click a field and drag a box around the text to fill it.</p></div></div>
  <div class="ix">
   <div class="card"><h2>Packet PDF</h2>
    <div class="vtool"><select id="sample">${SAMPLES.map(s=>`<option>${s}</option>`).join('')}</select><button class="btn sm" id="loadSample">Open sample</button><input type="file" id="file" accept="application/pdf" style="max-width:210px;font-size:12px"></div>
    <div class="vtool"><button class="btn sm" id="prev">&lsaquo;</button><span class="num" id="pg">0 / 0</span><button class="btn sm" id="next">&rsaquo;</button>
     <button class="btn sm" id="rotL">${ic('rot')} Rotate</button><button class="btn sm" id="zo">&minus;</button><span class="num" id="zl">100%</span><button class="btn sm" id="zi">+</button></div>
    <div id="stage"><div id="wrap"><canvas id="cv" width="10" height="10"></canvas><div id="ov"></div></div></div></div>
   <div class="card"><h2>Index packet</h2>
    <div class="vtool"><label class="ck"><input type="checkbox" id="down"> Fill down: drag around a column to fill rows</label><label class="ck"><input type="checkbox" id="auto" checked> Auto-advance</label></div>
    <div id="ocr">Open a PDF to begin.</div>
    <div class="fh fld sm" style="grid-template-columns:repeat(2,1fr)">
     <div><label>BOL #</label><input data-f="bol"></div><div><label>Vendor</label><input data-f="vendor"></div>
     <div><label>Ship date</label><input data-f="ship"></div><div><label>Carrier</label><input data-f="carrier"></div></div>
    <div class="tw"><table class="cells"><thead><tr id="thead">${COLS.map(c=>`<th data-c="${c[0]}">${c[1]}</th>`).join('')}<th></th></tr></thead><tbody id="rows"></tbody></table></div>
    <div class="vtool" style="margin-top:12px"><button class="btn sm" id="addRow">${ic('plus')} Add row</button><span style="flex:1"></span><button class="btn pri" id="save">Save and send to receivers</button></div>
    <p class="muted" id="msg" style="margin:6px 0 0;font-size:13px"></p></div>
  </div>`;
  const ov=$('#ov');
  $('#loadSample').onclick=()=>{curPdfName=$('#sample').value;curBlob=null;openUrl('/'+encodeURIComponent(curPdfName))};
  $('#file').onchange=e=>{const f=e.target.files[0];if(f){curPdfName=null;curBlob=URL.createObjectURL(f);f.arrayBuffer().then(openData)}};
  $('#prev').onclick=()=>{if(pdf&&pageNo>1){pageNo--;rend()}};$('#next').onclick=()=>{if(pdf&&pageNo<pdf.numPages){pageNo++;rend()}};
  $('#rotL').onclick=()=>{rot[pageNo]=((rot[pageNo]||0)+90)%360;delete boxes[pageNo];rend()};
  $('#zi').onclick=()=>{scale=Math.min(4,scale+.25);boxes={};rend()};$('#zo').onclick=()=>{scale=Math.max(.75,scale-.25);boxes={};rend()};
  $$('#thead th[data-c]').forEach(th=>th.onclick=()=>{const t=$$(`#rows [data-f=${th.dataset.c}]`).find(i=>!i.value)||$(`#rows [data-f=${th.dataset.c}]`);t&&setActive(t)});
  $('#addRow').onclick=()=>{const t=addRow();setActive(t.querySelector('input'))};
  for(let i=0;i<4;i++)addRow();setActive($('[data-f=bol]'));
  $('#save').onclick=saveNew;
  $$('[data-f]').forEach(i=>i.addEventListener('focus',()=>setActive(i)));
  bindDrag(ov);
}
async function openUrl(u){ocrs('Loading PDF...',1);try{const r=await fetch(u);if(!r.ok)throw new Error(r.status);openData(await r.arrayBuffer())}catch(e){ocrs('Load failed: '+e.message,2)}}
async function openData(buf){pdf=await pdfjsLib.getDocument({data:buf}).promise;pageNo=1;rot={};boxes={};scale=1.5;await rend();ocrs('Loaded '+pdf.numPages+' pages. Click a field, then drag a box on the page.')}
async function rend(){
  if(!pdf)return;const page=await pdf.getPage(pageNo);
  const vp=page.getViewport({scale,rotation:((page.rotate||0)+(rot[pageNo]||0))%360});
  const cv=$('#cv');cv.width=Math.floor(vp.width);cv.height=Math.floor(vp.height);
  await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
  $('#pg').textContent=pageNo+' / '+pdf.numPages;$('#zl').textContent=Math.round(scale/1.5*100)+'%';drawBoxes();
}
function drawBoxes(){$$('.box').forEach(b=>b.remove());(boxes[pageNo]||[]).forEach(b=>{const d=document.createElement('div');d.className='box';Object.assign(d.style,{left:b.x*scale+'px',top:b.y*scale+'px',width:b.w*scale+'px',height:b.h*scale+'px'});$('#ov').appendChild(d)})}
function bindDrag(ov){
  let drag=null,sel=null;
  ov.addEventListener('pointerdown',e=>{if(!pdf)return;ov.setPointerCapture(e.pointerId);const r=ov.getBoundingClientRect();drag={x:e.clientX-r.left,y:e.clientY-r.top};sel=document.createElement('div');sel.className='sel';ov.appendChild(sel)});
  ov.addEventListener('pointermove',e=>{if(!drag)return;const r=ov.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;Object.assign(sel.style,{left:Math.min(x,drag.x)+'px',top:Math.min(y,drag.y)+'px',width:Math.abs(x-drag.x)+'px',height:Math.abs(y-drag.y)+'px'})});
  ov.addEventListener('pointerup',async e=>{
    if(!drag)return;const r=ov.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
    const b={x:Math.min(x,drag.x),y:Math.min(y,drag.y),w:Math.abs(x-drag.x),h:Math.abs(y-drag.y)};drag=null;sel.remove();
    if(b.w<6||b.h<6)return;if(!active){ocrs('Click a field on the right first.',2);return}
    (boxes[pageNo]=boxes[pageNo]||[]).push({x:b.x/scale,y:b.y/scale,w:b.w/scale,h:b.h/scale});drawBoxes();await ocr(b)});
}
async function ocr(b){
  try{
    if(!ocrWorker){ocrs('Starting OCR engine (first use downloads language data)...',1);ocrWorker=await Tesseract.createWorker('eng')}
    const src=$('#cv'),k=Math.max(1,Math.min(3,Math.ceil(90/Math.max(b.h,1))));
    const c=document.createElement('canvas');c.width=b.w*k;c.height=b.h*k;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(src,b.x,b.y,b.w,b.h,0,0,c.width,c.height);
    const multi=$('#down').checked&&active.closest('tbody');
    await ocrWorker.setParameters({tessedit_pageseg_mode:multi||b.h>70?'6':'7'});ocrs('Reading...',1);
    const {data}=await ocrWorker.recognize(c);const lines=data.text.split('\n').map(s=>s.trim()).filter(Boolean);
    if(!lines.length)return ocrs('No text found. Try a tighter box or type it.',2);
    if(multi)fillDown(lines);else put(active,lines.join(' '));
    ocrs('Read '+(multi?lines.length+' lines':'"'+lines.join(' ')+'"')+'. Check the value and fix it if wrong.');
  }catch(err){ocrs('OCR failed: '+err.message,2)}
}
function clean(f,t){if(f==='po')return t.replace(/\s+/g,'').replace(/^T[XK]?[-_ ]?/i,'TX-').replace(/[Oo](?=\d)/g,'0');if(['heat','coil','cc','bol'].includes(f))return t.replace(/\s+/g,'');if(f==='wt')return t.replace(/[^\d.,]/g,'');return t}
function put(el,t){el.value=clean(el.dataset.f,t);if($('#auto').checked){const o=$$('[data-f]'),i=o.indexOf(el);if(i<o.length-1)setActive(o[i+1])}}
function fillDown(lines){const f=active.dataset.f;let tr=active.closest('tr');lines.forEach(t=>{if(!tr)tr=addRow();tr.querySelector(`[data-f=${f}]`).value=clean(f,t);tr=tr.nextElementSibling})}
function ocrs(t,k){const o=$('#ocr');if(!o)return;o.textContent=t;o.className=k===1?'busy':k===2?'err':''}
function addRow(v={}){const tr=document.createElement('tr');tr.innerHTML=COLS.map(c=>`<td><input data-f="${c[0]}" value="${esc(v[c[0]]||'')}"></td>`).join('')+'<td><button class="btn sm ghost" tabindex="-1" title="Remove row">&times;</button></td>';
  tr.querySelector('button').onclick=()=>tr.remove();tr.querySelectorAll('input').forEach(i=>i.addEventListener('focus',()=>setActive(i)));$('#rows').appendChild(tr);return tr}
function setActive(el){if(active)active.classList.remove('active');active=el;if(el){el.classList.add('active');el.focus({preventScroll:true})}}
function saveNew(){
  const bol=$('[data-f=bol]').value.trim();
  const rows=$$('#rows tr').map(tr=>{const o={};$$('input',tr).forEach(i=>o[i.dataset.f]=i.value.trim());return o}).filter(r=>r.po);
  const m=$('#msg');
  if(!bol||!rows.length){m.textContent='Needs a BOL # and at least one row with a PO #.';m.style.color='var(--red)';return}
  if(DB.packets.some(p=>p.bol===bol)){m.textContent='BOL '+bol+' is already in the system.';m.style.color='var(--red)';return}
  const p={id:'p'+Date.now(),bol,vendor:$('[data-f=vendor]').value.trim(),ship:$('[data-f=ship]').value.trim(),carrier:$('[data-f=carrier]').value.trim(),pdf:curPdfName,pdfBlob:curBlob,rows,stage:'new',created:Date.now(),forms:{},approvals:[],log:[]};
  addLog(p,ME().n,'Packet indexed, task created for receivers');DB.packets.push(p);persist();toast('Packet sent to receivers');nav('/p/'+p.id);
}

route();
</script>
