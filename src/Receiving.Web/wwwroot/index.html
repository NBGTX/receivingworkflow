<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steel Receiving</title>
<meta name="theme-color" content="#213B34">
<meta name="description" content="Steel receiving, inspection and approval">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/icons/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Receiving">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="app.css">
<script src="vendor/pdf.min.js"></script>
<script src="vendor/tesseract.min.js"></script>
</head>
<body>
<header class="top">
  <div class="brand"><b>Steel Receiving</b><span>Nucor Building Systems Texas</span></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="spacer"></div>
  <nav class="tabs tabs2" id="tabs2"></nav>
  <button class="btn sm" id="install" hidden>Install app</button>
  <div class="who" id="who"></div>
</header>
<main id="app"></main>
<div id="drawer"><div class="dh"><b id="dtitle">Packet</b><button class="btn sm" id="dclose">Close</button></div><div class="db" id="dbody"></div></div>
<div class="toast" id="toast"></div>
<script>pdfjsLib.GlobalWorkerOptions.workerSrc='vendor/pdf.worker.min.js'</script>
<script>
/* PWA: register the service worker and offer the install button */
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
let _ip=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();_ip=e;const b=document.getElementById('install');b.hidden=false;b.onclick=async()=>{b.hidden=true;_ip.prompt();await _ip.userChoice;_ip=null}});
addEventListener('appinstalled',()=>{const b=document.getElementById('install');if(b)b.hidden=true});
</script>
<script src="core.js"></script>
<script src="help.js"></script>
<script src="views.js"></script>
<script src="intake.js"></script>
<script src="intake2.js"></script>
<script src="settings.js"></script>
<script src="tol.js"></script>
<script src="toltab.js"></script>
<script src="dash.js"></script>
<script>
(async()=>{
  try{S.cfg=await api('GET','/api/config')}catch(e){}
  try{S.me=await api('GET','/api/auth/me')}catch(e){S.me=null}
  S.me?enter():showLogin();
})();
</script>
</body>
</html>
